name: Deploy Single Supabase Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Supabase function to deploy'
        required: true
        default: 'strava-sync'
        type: choice
        options:
          - strava-sync
          - strava-sync-daily
          - strava-webhook
          - strava-webhook-register

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # supabase/setup-cli@v1.6.0
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy selected function
        run: supabase functions deploy "${{ inputs.function_name }}" --no-verify-jwt
